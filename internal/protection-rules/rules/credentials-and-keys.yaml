version: 1

# Credential material. Every rule here is critical, meaning no carve out may
# override it. The asymmetry is the point: wrongly keeping a keychain costs a
# few megabytes, and wrongly removing one can lock a person out of accounts
# they have no other copy of.

rules:
  - id: user-keychain-directory
    match:
      type: prefix
      path: "~/Library/Keychains"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds the login keychain and its supporting databases, which store
      passwords, certificates, and private keys. There is frequently no other
      copy, and a keychain removed while unlocked is not recoverable from a
      running system.
    provenance:
      source: "Apple Platform Security, keychain data protection. Directory presence confirmed on macOS running Darwin 25.6."
      method: system-inspection
      verified: "2026-08-05"

  - id: system-keychain-directory
    match:
      type: prefix
      path: "/Library/Keychains"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds machine level keychains including the System keychain and the
      certificate trust store. Removal affects every account on the machine and
      can break network authentication and certificate validation.
    provenance:
      source: "Apple Platform Security, keychain data protection."
      method: documentation
      verified: "2026-08-05"

  - id: privacy-consent-database
    match:
      type: prefix
      path: "~/Library/Application Support/com.apple.TCC"
    effect: protect
    severity: critical
    category: platform-security
    reason: >-
      The Transparency, Consent and Control database records which applications
      the user granted camera, microphone, screen recording, and file access to.
      Removing it revokes every decision the user has made and forces a
      re-prompt for all of them.
    provenance:
      source: "Apple Support, controlling app access to camera, microphone and files. Directory presence confirmed on macOS running Darwin 25.6."
      method: system-inspection
      verified: "2026-08-05"

  - id: account-database
    match:
      type: prefix
      path: "~/Library/Accounts"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Stores the account records that Mail, Calendar, Contacts and other system
      services authenticate against. Removal signs the user out of connected
      accounts and can require re-authorizing each one.
    provenance:
      source: "Directory presence and contents confirmed on macOS running Darwin 25.6, alongside Apple Support guidance on internet accounts."
      method: system-inspection
      verified: "2026-08-05"

  - id: ssh-private-keys
    match:
      type: prefix
      path: "~/.ssh"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds SSH private keys, known host records, and client configuration. A
      private key that exists nowhere else cannot be regenerated, and losing it
      can mean losing access to servers and signing identities.
    provenance:
      source: "OpenSSH manual pages for ssh and ssh_config, which document ~/.ssh as the per user configuration and key directory."
      method: documentation
      verified: "2026-08-05"

  - id: gnupg-keyring
    match:
      type: prefix
      path: "~/.gnupg"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds GnuPG private keyrings and trust database. A lost secret key cannot
      be recovered and any data encrypted to it becomes unreadable.
    provenance:
      source: "GnuPG manual, which documents the GNUPGHOME default of ~/.gnupg for keyrings and trust state."
      method: documentation
      verified: "2026-08-05"

  - id: cloud-provider-credentials
    match:
      type: prefix
      path: "~/.aws"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds long lived access keys and named profile configuration for cloud
      infrastructure. These grant real spending and data access, and are often
      not recorded anywhere else on the machine.
    provenance:
      source: "AWS Command Line Interface user guide, configuration and credential file settings."
      method: documentation
      verified: "2026-08-05"

  - id: kubernetes-cluster-credentials
    match:
      type: prefix
      path: "~/.kube"
    effect: protect
    severity: critical
    category: credentials
    reason: >-
      Holds cluster endpoints, client certificates and tokens used to
      authenticate to Kubernetes clusters. Removal disconnects the user from
      every configured cluster and may require an administrator to reissue
      access.
    provenance:
      source: "Kubernetes documentation, organizing cluster access using kubeconfig files."
      method: documentation
      verified: "2026-08-05"
